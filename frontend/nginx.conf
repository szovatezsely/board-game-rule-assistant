server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Rulebook uploads are many photos in one request; the backend caps the
    # total at 400 MB, so nginx must not reject it first.
    client_max_body_size 400m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable, so they can be cached hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Page transcription and speech synthesis both far outrun the 60s
        # default, and streaming the request through avoids buffering a
        # multi-hundred-megabyte upload to disk first.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_request_buffering off;
    }

    # SPA history fallback: deep links like /jatek/<uuid> must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html names the hashed bundles, so it must be revalidated on every
        # load; without this, browsers kept serving the page from before a rebuild.
        add_header Cache-Control "no-cache";
    }
}
